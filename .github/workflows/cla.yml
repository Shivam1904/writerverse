# Contributor License Agreement check (CLA Assistant Lite).
#
# On each pull request it checks that every commit author has signed CLA.md.
# A new contributor signs by commenting the sentence below on their PR.
# Signatures are stored in signatures/cla.json on the `cla-signatures` branch
# (create that branch once, from main, before the first outside PR).
#
# Safety: `pull_request_target` runs with this repo's token, so this workflow
# never checks out or runs code from the pull request. It only reads PR
# metadata and writes a comment, a status and the signatures file.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write # write signatures to the cla-signatures branch
  pull-requests: write # comment on the PR
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the WriterVerse CLA and I agree to its terms.'))
    steps:
      - name: Check CLA signatures
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: ${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: Shivam1904,aakarshika,dependabot[bot],github-actions[bot]
          custom-pr-sign-comment: I have read the WriterVerse CLA and I agree to its terms.
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before we can merge it, please read
            the [WriterVerse Contributor License Agreement](${{ github.server_url }}/${{ github.repository }}/blob/main/CLA.md)
            and sign it by posting the comment below on this pull request.
            You only need to do this once.
          custom-allsigned-prcomment: All contributors have signed the WriterVerse CLA. Thank you.
          signed-commit-message: "chore(cla): $contributorName signed the CLA in #$pullRequestNo"
          create-file-commit-message: "chore(cla): create the CLA signatures file"
          lock-pullrequest-aftermerge: false
