name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  docs:
    name: Docs — upkeep check (warn only)
    runs-on: ubuntu-24.04  # pinned: Playwright 1.60 does not support Ubuntu 26 (ubuntu-latest since 2026-10)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history: the 'behind its code' check reads git log
      - name: Docs check
        run: python3 scripts/docs_check.py

  backend:
    name: Backend — lint + test
    runs-on: ubuntu-24.04  # pinned: Playwright 1.60 does not support Ubuntu 26 (ubuntu-latest since 2026-10)
    services:
      # The backend suite runs on Postgres, like local dev and production.
      postgres:
        image: ankane/pgvector
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check backend/

      - name: Import layers (import-linter)
        run: cd backend && uv run lint-imports --config ../pyproject.toml --no-logo

      - name: Test (Postgres, same database as the app)
        run: cd backend && uv run python manage.py test --verbosity=2
        env:
          SECRET_KEY: ci-test-secret-key-not-used-in-production
          DEBUG: "True"
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci

      - name: Smoke wiring (collect-only — NO LLM calls, $0)
        # IMPORTANT: this NEVER runs the paid smoke suite.
        #   1. `--collect-only` imports/discovers tests but executes NO test body.
        #   2. API keys are explicitly emptied, so conftest.py skips every smoke test.
        # The real, paid suite runs ONLY via `make night-eyes-smoke`, manually, on demand.
        run: cd backend && uv run python -m pytest -m smoke actions/tests/ --collect-only -q
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: ci-test-secret-key-not-used-in-production
          DEBUG: "True"
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""

  frontend:
    name: Frontend — build & test
    runs-on: ubuntu-24.04  # pinned: Playwright 1.60 does not support Ubuntu 26 (ubuntu-latest since 2026-10)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint (eslint)
        run: cd frontend && npx eslint .

      # The production build (`tsc -b && vite build`) is what Vercel runs. Without
      # it here, a TypeScript error passes CI and only fails at deploy time — that
      # is exactly how 7 type errors reached main on 2026-06-06 and broke every
      # production deploy for two months before anyone noticed.
      - name: Build (same command Vercel runs)
        run: cd frontend && npm run build

      - name: Test
        run: cd frontend && npm test -- --run

  e2e:
    name: E2E — core author journey
    # Types prose into a scene, waits for auto-save, reloads, checks the prose survived.
    # Guards the "lost prose" class of bugs. No paid LLM calls.
    runs-on: ubuntu-24.04  # pinned: Playwright 1.60 does not support Ubuntu 26 (ubuntu-latest since 2026-10)
    services:
      postgres:
        image: ankane/pgvector
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: writerverse_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "1"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/writerverse_e2e
      SECRET_KEY: ci-e2e-secret-key-not-used-in-production
      DEBUG: "True"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      # No keys here, so tell the startup check not to require them (it would
      # stop migrate/runserver otherwise). The journey uses no AI.
      AI_ENABLED: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: uv sync && (cd frontend && npm ci)

      - name: Install browser
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run the journey
        run: scripts/e2e.sh

      - name: Keep failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: frontend/test-results/
          retention-days: 7
