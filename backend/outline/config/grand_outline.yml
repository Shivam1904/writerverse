# Grand-outline scaffolds and the story-template registry they come from.
# Loaded by outline/engine/config.py. Tune HERE, not in code.

# Structural beat sets. Used as the coverage chart's `required` set AND shown
# as the outline-scaffold preview at template-selection time.
scaffold:
  three_act:
    - "Act I — Setup"
    - "Inciting Incident"
    - "Act II — Confrontation"
    - "Midpoint"
    - "Crisis"
    - "Act III — Resolution"
    - "Climax"
    - "Denouement"
  hero_journey:
    - "Ordinary World"
    - "Call to Adventure"
    - "Refusal of the Call"
    - "Meeting the Mentor"
    - "Crossing the Threshold"
    - "Tests, Allies, Enemies"
    - "Approach"
    - "Ordeal"
    - "Reward"
    - "The Road Back"
    - "Resurrection"
    - "Return with the Elixir"
  save_the_cat:
    - "Opening Image"
    - "Theme Stated"
    - "Set-Up"
    - "Catalyst"
    - "Debate"
    - "Break into Two"
    - "B Story"
    - "Fun and Games"
    - "Midpoint"
    - "Bad Guys Close In"
    - "All Is Lost"
    - "Dark Night of the Soul"
    - "Break into Three"
    - "Finale"
    - "Final Image"
  tragedy:
    - "Anticipation"
    - "Dream"
    - "Frustration"
    - "Nightmare"
    - "Destruction"

# Grand-outline base skeletons — the act list the writer starts from at Init.
# SEPARATE from `scaffold:` above: `scaffold` is a flat beat list that plot
# threads consume; `base_scaffold` is just the NAMED ACTS for the grand outline.
# Only acts are named here; `default_grand_outline()` seeds each act with one
# empty-titled chapter holding one empty-titled scene (the writer fills those
# in). One entry per template with `grand_outline_base_fit: true`. Templates
# missing here fall back to a generic one-act-per-beat build from `scaffold`.
base_scaffold:
  three_act:
    - "Act I — Setup"
    - "Act II — Confrontation"
    - "Act III — Resolution"
  hero_journey:
    - "Ordinary World"
    - "Call to Adventure"
    - "Refusal of the Call"
    - "Meeting the Mentor"
    - "Crossing the Threshold"
    - "Tests, Allies, Enemies"
    - "Approach"
    - "Ordeal"
    - "Reward"
    - "The Road Back"
    - "Resurrection"
    - "Return with the Elixir"

# Flat template registry. template = scope_type + a BUNDLE of candidate charts.
# `scaffold:` and a chart's `required:` are scaffold keys, resolved at load.
#
# bit_dependency (v2):
#   Engine NEVER judges. All charts are probe-driven (trajectory/coverage).
#   bit_dependency declares what bits, if any, the OUTLINE pass needs to
#   honour as constraints when drafting scenes.
#     none     — chart template (probe-driven), no bits read
#     state    — outline tracker; needs `state` bits (sub: location|emotional|...)
#     thread   — outline tracker; needs `thread` bits (sub: plant|payoff)
#     rule     — outline tracker; needs `rule` bits as invariants the outline
#                must not violate
#     optional — chart template that can be augmented by bits if writer adds them
templates:
  # ---- story ----
  - id: three_act
    label: "Three-Act Structure"
    scope_type: story
    scaffold: three_act
    grand_outline_base_fit: true   # v3 §6 — last-level heading (scene) can hold beats
    bit_dependency: none
    charts:
      - {id: three_act.coverage, label: "Required beats present", backend: coverage, mode: consistency, required: three_act}
  - id: hero_journey
    label: "Hero's Journey"
    scope_type: story
    scaffold: hero_journey
    grand_outline_base_fit: true   # v3 §6 — last-level heading can hold beats
    bit_dependency: none
    charts:
      - {id: hero_journey.coverage, label: "Required beats present", backend: coverage, mode: consistency, required: hero_journey}
      - {id: hero_journey.tension, label: "Tension shape", backend: trajectory, mode: descriptive}
  - id: save_the_cat
    label: "Save the Cat"
    scope_type: story
    scaffold: save_the_cat
    grand_outline_base_fit: false  # v3 §6 — leaves are terminal beats, no scene container
    bit_dependency: none
    charts:
      - {id: save_the_cat.coverage, label: "Required beats present", backend: coverage, mode: consistency, required: save_the_cat}
  - id: tragedy
    label: "Tragedy (Booker)"
    scope_type: story
    scaffold: tragedy
    grand_outline_base_fit: false  # v3 §6 — five terminal beats, no container level
    bit_dependency: none
    charts:
      - {id: tragedy.coverage, label: "Required beats present", backend: coverage, mode: consistency, required: tragedy}
      # v3 §11 — y_items ORDERED LOW→HIGH on the axis. `falling` rule expects
      # value to descend along the axis (thriving → destroyed = index 5→0).
      - {id: tragedy.fall, label: "Protagonist fortune falls", backend: trajectory, mode: consistency,
         y_items: [destroyed, ruined, struggling, shaken, secure, thriving],
         math_rule: falling,
         math_rule_explain: "A tragedy expects the protagonist's fortune to fall across the story. If the chart trends flat or up, check whether the descent is being staged convincingly enough."}
  - id: chekhov
    label: "Setup -> Payoff (Chekhov)"
    scope_type: story
    bit_dependency: optional
    charts:
      - {id: chekhov, label: "Every setup pays off", backend: dependency, mode: consistency}
  - id: pacing
    label: "Pacing / Tension"
    scope_type: story
    bit_dependency: none
    charts:
      - {id: pacing, label: "Tension envelope", backend: trajectory, mode: descriptive}
  - id: red_herring
    label: "Red Herring -> Reveal-as-False"
    scope_type: story
    bit_dependency: thread
    bit_kinds_consumed: [{kind: thread, sub: plant}, {kind: thread, sub: payoff}]
    charts:
      - {id: red_herring, label: "Every false clue is revealed as false", backend: dependency, mode: consistency}
  - id: mice_threads
    label: "MICE Threads (Card)"
    scope_type: story
    bit_dependency: thread
    bit_kinds_consumed: [{kind: thread, sub: plant}, {kind: thread, sub: payoff}]
    charts:
      - {id: mice_threads, label: "Threads open and close in nest order", backend: dependency, mode: consistency}
  - id: promise_progress_payoff
    label: "Promise -> Progress -> Payoff (Sanderson)"
    scope_type: story
    bit_dependency: thread
    bit_kinds_consumed: [{kind: thread, sub: plant}, {kind: thread, sub: progress}, {kind: thread, sub: payoff}]
    charts:
      - {id: promise_progress_payoff, label: "Every promise reaches all three phases", backend: coverage, mode: consistency}
  - id: hard_magic_rules
    label: "Magic / World Rules (hard)"
    scope_type: story
    bit_dependency: rule
    bit_kinds_consumed: [{kind: rule, sub: hard_rule}]
    charts:
      - {id: hard_magic_rules, label: "Outline honours declared rules", backend: ledger, mode: consistency}
  - id: dramatic_irony
    label: "Dramatic Irony Gap"
    scope_type: story
    bit_dependency: state
    bit_kinds_consumed: [{kind: state, sub: knowledge}]
    charts:
      - {id: dramatic_irony, label: "Reader-vs-character knowledge gap", backend: trajectory, mode: descriptive}
  # ---- story: scene properties ----
  - id: scene_pacing
    label: "Scene Pacing"
    scope_type: story
    bit_dependency: none
    charts:
      - {id: scene_pacing, label: "Dominant scene mode", backend: trajectory, mode: descriptive,
         render: bar,
         y_items: [action, dialogue, introspection, exposition, transition]}
  - id: scene_mood
    label: "Scene Mood"
    scope_type: story
    bit_dependency: none
    charts:
      - {id: scene_mood, label: "Emotional colour of each scene", backend: trajectory, mode: descriptive,
         render: line,
         y_items: [bleak, sombre, neutral, warm, radiant]}
  - id: scene_intensity
    label: "Scene Intensity"
    scope_type: story
    bit_dependency: none
    charts:
      - {id: scene_intensity, label: "How much is happening", backend: trajectory, mode: descriptive,
         render: line,
         y_items: [quiet, building, active, heated, explosive]}
  - id: characters_present
    label: "Cast per Scene"
    scope_type: story
    bit_dependency: none
    charts:
      - {id: characters_present, label: "Which characters appear in each scene", backend: ledger, mode: descriptive}
  # ---- story: hook quality ----
  - id: hook_opening
    label: "Opening Hook Strength"
    scope_type: story
    bit_dependency: none
    charts:
      - {id: hook_opening, label: "How strongly each scene opens", backend: trajectory, mode: descriptive,
         render: line,
         y_items: [flat, adequate, engaging, compelling, gripping]}
  - id: hook_closing
    label: "Closing Hook Strength"
    scope_type: story
    bit_dependency: none
    charts:
      - {id: hook_closing, label: "How strongly each scene closes", backend: trajectory, mode: descriptive,
         render: line,
         y_items: [flat, adequate, engaging, compelling, gripping]}
  # ---- story: genre conventions ----
  - id: genre_romance
    label: "Romance Conventions"
    scope_type: story
    bit_dependency: none
    charts:
      - id: genre_romance
        label: "Romance genre conventions met"
        backend: ledger
        mode: consistency
        y_items:
          - "Central love story drives the plot"
          - "Meet-cute or inciting romantic event"
          - "Romantic tension and obstacles"
          - "Emotional vulnerability shown"
          - "Satisfying romantic resolution (HEA/HFN)"
  - id: genre_thriller
    label: "Thriller Conventions"
    scope_type: story
    bit_dependency: none
    charts:
      - id: genre_thriller
        label: "Thriller genre conventions met"
        backend: ledger
        mode: consistency
        y_items:
          - "Stakes established early and escalate"
          - "Ticking clock or deadline pressure"
          - "Antagonist force is credible and active"
          - "Protagonist is under personal threat"
          - "Twists or revelations shift understanding"
  - id: genre_mystery
    label: "Mystery Conventions"
    scope_type: story
    bit_dependency: none
    charts:
      - id: genre_mystery
        label: "Mystery genre conventions met"
        backend: ledger
        mode: consistency
        y_items:
          - "Central question or crime posed early"
          - "Clues planted fairly for the reader"
          - "Red herrings present but distinguishable"
          - "Investigation drives the plot forward"
          - "Solution is logical and earned"
  - id: genre_fantasy
    label: "Fantasy Conventions"
    scope_type: story
    bit_dependency: none
    charts:
      - id: genre_fantasy
        label: "Fantasy genre conventions met"
        backend: ledger
        mode: consistency
        y_items:
          - "Secondary world or magical system introduced"
          - "Magic/world rules are internally consistent"
          - "Worldbuilding revealed through action not dumps"
          - "Quest, conflict, or power struggle drives plot"
          - "Sense of wonder or discovery present"
  - id: genre_scifi
    label: "Sci-Fi Conventions"
    scope_type: story
    bit_dependency: none
    charts:
      - id: genre_scifi
        label: "Sci-fi genre conventions met"
        backend: ledger
        mode: consistency
        y_items:
          - "Speculative premise grounded in logic"
          - "Technology or science shapes the conflict"
          - "Societal or philosophical implications explored"
          - "World rules are internally consistent"
          - "Human element grounds the speculation"
  - id: genre_horror
    label: "Horror Conventions"
    scope_type: story
    bit_dependency: none
    charts:
      - id: genre_horror
        label: "Horror genre conventions met"
        backend: ledger
        mode: consistency
        y_items:
          - "Atmosphere of dread established early"
          - "Threat is unknown, unpredictable, or overwhelming"
          - "Isolation or vulnerability of characters"
          - "Tension builds through pacing and restraint"
          - "Consequences feel real and irreversible"
  - id: genre_literary
    label: "Literary Fiction Conventions"
    scope_type: story
    bit_dependency: none
    charts:
      - id: genre_literary
        label: "Literary fiction conventions met"
        backend: ledger
        mode: consistency
        y_items:
          - "Character interiority drives the narrative"
          - "Prose style is deliberate and distinctive"
          - "Thematic resonance across scenes"
          - "Subtext present in dialogue and action"
          - "Ambiguity or complexity in moral questions"
  - id: genre_historical
    label: "Historical Fiction Conventions"
    scope_type: story
    bit_dependency: none
    charts:
      - id: genre_historical
        label: "Historical fiction conventions met"
        backend: ledger
        mode: consistency
        y_items:
          - "Period setting is specific and researched"
          - "Historical detail woven into action naturally"
          - "Characters reflect the values and constraints of the era"
          - "Tension between historical events and personal story"
          - "Anachronisms avoided in language and behaviour"
  # ---- character ----
  - id: power_corrupts
    label: "Power Corrupts"
    scope_type: character
    bit_dependency: none
    charts:
      # v3 §3 — ordered vocab y_items + math_rule. The order defines the axis.
      - {id: power_corrupts, label: "Corruption rises", backend: trajectory, mode: consistency,
         y_items: [principled, tempted, compromised, tyrannical],
         math_rule: rising,
         math_rule_explain: "A 'power corrupts' arc expects the character to slide from principled toward tyrannical. If the chart trends flat or down, ask whether the corruption is being motivated convincingly."}
  - id: redemption_arc
    label: "Redemption Arc"
    scope_type: character
    bit_dependency: none
    charts:
      - {id: redemption_arc, label: "Moral standing rises", backend: trajectory, mode: consistency,
         y_items: [unredeemed, conflicted, contrite, redeemed],
         math_rule: rising,
         math_rule_explain: "A redemption arc expects moral standing to climb across the story. If the chart trends flat or down, ask whether the character is earning each step toward redemption."}
  - id: tragic_fall
    label: "Tragic Fall"
    scope_type: character
    bit_dependency: none
    charts:
      # y_items LOW→HIGH on the fortune axis. falling = value descends.
      - {id: tragic_fall, label: "Fortune falls", backend: trajectory, mode: consistency,
         y_items: [ruined, struggling, shaken, secure, thriving],
         math_rule: falling,
         math_rule_explain: "A tragic-fall arc expects fortune to drop from thriving toward ruined. If the chart trends flat or up, the fall isn't being staged."}
  - id: lie_to_truth
    label: "Lie -> Truth Arc"
    scope_type: character
    bit_dependency: none
    charts:
      - {id: lie_to_truth, label: "Belief moves lie to truth", backend: trajectory, mode: consistency,
         y_items: [denial, doubting, confronting, accepting, integrated],
         math_rule: rising,
         math_rule_explain: "A lie-to-truth arc expects self-knowledge to rise — the character moves from denial toward integrated truth. Flat or downward trends suggest the character isn't being pushed."}
  - id: emotional_journey
    label: "Emotional Journey"
    scope_type: character
    bit_dependency: none
    charts:
      # v3 §3 — descriptive trajectory: predefined vocab (no math rule, no ordering).
      - {id: emotional_journey, label: "Emotion mirror", backend: trajectory, mode: descriptive,
         y_items: [joy, sorrow, fear, anger, love, dread, hope, resolve]}
  - id: character_knowledge
    label: "Knowledge Tracker"
    scope_type: character
    bit_dependency: state    # needs `state` sub: knowledge bits
    bit_kinds_consumed: [{kind: state, sub: knowledge}]
    charts:
      - {id: character_knowledge, label: "Who knows what", backend: ledger, mode: consistency}
  - id: location_tracker
    label: "Where they are"
    scope_type: character
    bit_dependency: state    # needs `state` sub: location bits
    bit_kinds_consumed: [{kind: state, sub: location}]
    charts:
      - {id: location_tracker, label: "Location across scenes", backend: ledger, mode: consistency}
  - id: condition_tracker
    label: "Body / mind condition"
    scope_type: character
    bit_dependency: state    # needs `state` sub: condition bits
    bit_kinds_consumed: [{kind: state, sub: condition}]
    charts:
      - {id: condition_tracker, label: "Condition across scenes (wound, illness, transformation)", backend: ledger, mode: consistency}
  # ---- character arcs ported from the legacy story-arc page ----
  # Descriptive trajectories (no math_rule — they rise AND fall). Numeric legacy
  # scales (e.g. tension 0-10) are collapsed to 5-tick enums by design. `render`
  # is the frontend draw type: line (default) | bar — set per chart_def.
  - id: emotional_intensity
    label: "Emotional Intensity"
    scope_type: character
    bit_dependency: none
    charts:
      - {id: emotional_intensity, label: "How strongly they feel", backend: trajectory, mode: descriptive,
         render: line,
         y_items: [numb, faint, present, strong, overwhelming]}
  - id: tension_arc
    label: "Tension (per character)"
    scope_type: character
    bit_dependency: none
    charts:
      - {id: tension_arc, label: "Tension they're under", backend: trajectory, mode: descriptive,
         render: line,
         y_items: [calm, uneasy, tense, alarmed, critical]}
  - id: agency_arc
    label: "Agency"
    scope_type: character
    bit_dependency: none
    charts:
      - {id: agency_arc, label: "How much they drive events", backend: trajectory, mode: descriptive,
         render: line,
         y_items: [passive, reactive, deciding, acting, driving]}
  # ---- character: voice fingerprints ----
  - id: voice_vocab
    label: "Vocabulary Level"
    scope_type: character
    bit_dependency: none
    charts:
      - {id: voice_vocab, label: "How complex their word choices are", backend: trajectory, mode: descriptive,
         render: line,
         y_items: [crude, simple, moderate, elevated, ornate]}
  - id: voice_rhythm
    label: "Sentence Rhythm"
    scope_type: character
    bit_dependency: none
    charts:
      - {id: voice_rhythm, label: "How long their sentences run", backend: trajectory, mode: descriptive,
         render: line,
         y_items: [clipped, terse, balanced, flowing, sprawling]}
  - id: voice_tone
    label: "Speech Tone"
    scope_type: character
    bit_dependency: none
    charts:
      - {id: voice_tone, label: "Emotional register of their speech", backend: trajectory, mode: descriptive,
         render: line,
         y_items: [cold, guarded, casual, warm, intense]}
  - id: voice_formality
    label: "Formality"
    scope_type: character
    bit_dependency: none
    charts:
      - {id: voice_formality, label: "How formal or loose their speech is", backend: trajectory, mode: descriptive,
         render: line,
         y_items: [vulgar, colloquial, neutral, formal, ceremonial]}
  # ---- character: relationship state (dynamic y_items) ----
  - id: relationship_state
    label: "Relationship States"
    scope_type: character
    bit_dependency: none
    charts:
      - {id: relationship_state, label: "How their key relationships shift", backend: trajectory, mode: descriptive,
         render: line}
      # No hardcoded y_items — extracted dynamically per relationship pair.
      # The extract-y-items prompt generates states that include the other
      # character's name (e.g. "hostile to Misa", "allied with Misa").
      # See PHASE3_FUN_PROGRESS.md Category 4b for the extract prompt design.
  # ---- relationship ----
  - id: relationship
    label: "Relationship Arc"
    scope_type: relationship
    bit_dependency: none
    charts:
      - {id: relationship, label: "Closeness over time", backend: trajectory, mode: descriptive}
  - id: rivalry
    label: "Rivalry -> Resolution"
    scope_type: relationship
    bit_dependency: none
    charts:
      # y_items LOW→HIGH on the antagonism axis. falling = antagonism drops.
      - {id: rivalry, label: "Antagonism resolves", backend: trajectory, mode: consistency,
         y_items: [allied, civil, wary, hostile, enemies],
         math_rule: falling,
         math_rule_explain: "A rivalry-to-resolution arc expects antagonism to fall — the pair moves from enemies toward allied. Flat or rising trends mean the rivalry isn't resolving."}
  - id: alliance_tracker
    label: "Alliance / faction state"
    scope_type: relationship
    bit_dependency: state    # needs `state` sub: alliance bits
    bit_kinds_consumed: [{kind: state, sub: alliance}]
    charts:
      - {id: alliance_tracker, label: "Allied -> enemy state shifts", backend: ledger, mode: consistency}
  # ---- object ----
  - id: item_custody
    label: "Item Custody"
    scope_type: object
    bit_dependency: state    # needs `state` sub: possession bits
    bit_kinds_consumed: [{kind: state, sub: possession}]
    charts:
      - {id: item_custody, label: "Chain of custody", backend: ledger, mode: consistency}
  # ---- custom (special charts) ----
  # Hidden generic vehicles for AI-suggested "special charts" — bespoke
  # scales the template library can't express (e.g. a "secretly alike"
  # relationship arc on a custom worlds-apart->mirror-images scale). One
  # per scope_type. `hidden: true` keeps them off the suggester menu and
  # the manual-bind UI; they're reached only via run_suggest_special_charts
  # + the bind_special endpoint, which fills y_items/title/target into
  # chart_overrides. Descriptive trajectory => chart_type `state`,
  # y_items_source `user-defined`.
  - id: custom_story
    label: "Custom chart"
    scope_type: story
    hidden: true
    bit_dependency: none
    charts:
      - {id: custom, label: "Custom scale", backend: trajectory, mode: descriptive}
  - id: custom_character
    label: "Custom chart"
    scope_type: character
    hidden: true
    bit_dependency: none
    charts:
      - {id: custom, label: "Custom scale", backend: trajectory, mode: descriptive}
  - id: custom_object
    label: "Custom chart"
    scope_type: object
    hidden: true
    bit_dependency: none
    charts:
      - {id: custom, label: "Custom scale", backend: trajectory, mode: descriptive}
  - id: custom_relationship
    label: "Custom chart"
    scope_type: relationship
    hidden: true
    bit_dependency: none
    charts:
      - {id: custom, label: "Custom scale", backend: trajectory, mode: descriptive}
