{% comment %}Bulletproof button: VML for Outlook on Windows, a padded table cell everywhere else.
Use: {% include "accounts/emails/_button.html" with url=link label="..." show_url=True %}{% endcomment %}<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:10px 0 {% if show_url %}14px{% else %}26px{% endif %} 0;">
  <tr>
    <td>
      <!--[if mso]>
      <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{ url }}" style="height:48px; v-text-anchor:middle; width:260px;" arcsize="17%" stroke="f" fillcolor="#1d242e">
        <w:anchorlock/>
        <center style="color:#ffffff; font-family:Arial,sans-serif; font-size:15px; font-weight:bold;">{{ label }}</center>
      </v:roundrect>
      <![endif]-->
      <!--[if !mso]><!-->
      <table role="presentation" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td bgcolor="#1d242e" style="border-radius:8px; background-color:#1d242e;">
            <a href="{{ url }}" target="_blank" style="display:inline-block; padding:14px 30px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; font-weight:600; line-height:20px; color:#ffffff; text-decoration:none; border-radius:8px;">{{ label }}</a>
          </td>
        </tr>
      </table>
      <!--<![endif]-->
    </td>
  </tr>
</table>
{% if show_url %}<p style="margin:0 0 22px 0; font-size:12px; line-height:1.6; color:#8a94aa;">Or paste this link into your browser:<br><a href="{{ url }}" target="_blank" style="color:#8a94aa; text-decoration:underline; word-break:break-all;">{{ url }}</a></p>{% endif %}
